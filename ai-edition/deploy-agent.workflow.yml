name: Deploy isolated Analyst terminal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ai-edition/**'
      - '.github/workflows/deploy-agent.yml'
permissions:
  contents: read
concurrency:
  group: analyst-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-edition
    env:
      CLOUDFLARE_ACCOUNT_ID: '39cfe59215d450c59f78d9f0f52f585e'
      AGENT_D1_DATABASE_ID: ${{ vars.AGENT_D1_DATABASE_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai-edition/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build Analyst Worker
        run: npm run build
      - name: Verify game, three transcripts, and HTTP transport
        run: npm test
      - name: Deploy Analyst database and Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Cloudflare authorization required::Add the repository secret CLOUDFLARE_API_TOKEN, then re-run this job. Nothing has been deployed to Cloudflare."
            exit 1
          fi
          npm run deploy
