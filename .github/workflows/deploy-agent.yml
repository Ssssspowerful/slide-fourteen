name: Deploy isolated Analyst terminal
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: analyst-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-edition
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AGENT_D1_DATABASE_ID: ${{ vars.AGENT_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai-edition/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node configure.mjs
      - run: npx wrangler d1 migrations apply slide-fourteen-agent --remote --config wrangler.deploy.json
      - run: npx wrangler deploy --config wrangler.deploy.json
